<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563eb" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Shield Rounded Card -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg-grad)" stroke="#334155" stroke-width="8" />
  
  <!-- Outer Shield Glow Outline -->
  <path d="M256 96 L384 144 V248 C384 328 328 396 256 424 C184 396 128 328 128 248 V144 Z" 
        fill="url(#accent-grad)" 
        filter="url(#shadow)" />
  
  <!-- Wi-Fi Wave 3 (Outer) -->
  <path d="M 180 230 A 100 100 0 0 1 332 230" 
        fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />

  <!-- Wi-Fi Wave 2 (Middle) -->
  <path d="M 205 270 A 65 65 0 0 1 307 270" 
        fill="none" stroke="#93c5fd" stroke-width="20" stroke-linecap="round" />

  <!-- Wi-Fi Wave 1 (Inner) -->
  <path d="M 230 310 A 30 30 0 0 1 282 310" 
        fill="none" stroke="#60a5fa" stroke-width="18" stroke-linecap="round" />

  <!-- Wi-Fi Center Dot -->
  <circle cx="256" cy="345" r="16" fill="#ffffff" />
</svg>
