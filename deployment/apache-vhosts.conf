# =============================================================================
# De Royal Hotspot OS — Apache Virtual Host Configuration
# =============================================================================
# Place this file at: /etc/apache2/sites-available/deroyalhotspot.conf
# Enable: sudo a2ensite deroyalhotspot
# Reload: sudo systemctl reload apache2
#
# Prerequisites:
#   sudo a2enmod proxy proxy_http rewrite headers ssl
#
# Replace 127.0.0.1:5000 with your actual backend port if different.
# Replace /var/www/deroyal-hotspot-os/frontend/dist with your actual build path.
# =============================================================================

# ── Main domain — public website + captive portal + legacy admin ──────────────
<VirtualHost *:80>
    ServerName deroyalhotspot.name.ng
    Redirect permanent / https://deroyalhotspot.name.ng/
</VirtualHost>

<VirtualHost *:443>
    ServerName deroyalhotspot.name.ng
    DocumentRoot /var/www/deroyal-hotspot-os/frontend/dist

    SSLEngine on
    SSLCertificateFile     /etc/letsencrypt/live/deroyalhotspot.name.ng/fullchain.pem
    SSLCertificateKeyFile  /etc/letsencrypt/live/deroyalhotspot.name.ng/privkey.pem

    # Serve the React SPA
    <Directory /var/www/deroyal-hotspot-os/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        # React Router — send all non-file requests to index.html
        FallbackResource /index.html
    </Directory>

    # Proxy all /api/* requests to Express backend
    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:5000/api/
    ProxyPassReverse /api/ http://127.0.0.1:5000/api/

    # Security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog  ${APACHE_LOG_DIR}/deroyal-main-error.log
    CustomLog ${APACHE_LOG_DIR}/deroyal-main-access.log combined
</VirtualHost>


# ── app.deroyalhotspot.name.ng — ISP dashboard ───────────────────────────────
<VirtualHost *:80>
    ServerName app.deroyalhotspot.name.ng
    Redirect permanent / https://app.deroyalhotspot.name.ng/
</VirtualHost>

<VirtualHost *:443>
    ServerName app.deroyalhotspot.name.ng
    DocumentRoot /var/www/deroyal-hotspot-os/frontend/dist

    SSLEngine on
    SSLCertificateFile     /etc/letsencrypt/live/deroyalhotspot.name.ng/fullchain.pem
    SSLCertificateKeyFile  /etc/letsencrypt/live/deroyalhotspot.name.ng/privkey.pem

    <Directory /var/www/deroyal-hotspot-os/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        FallbackResource /index.html
    </Directory>

    # Same backend API — single backend serves all subdomains
    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:5000/api/
    ProxyPassReverse /api/ http://127.0.0.1:5000/api/

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog  ${APACHE_LOG_DIR}/deroyal-app-error.log
    CustomLog ${APACHE_LOG_DIR}/deroyal-app-access.log combined
</VirtualHost>


# ── platform.deroyalhotspot.name.ng — DHOS Super Admin ──────────────────────
<VirtualHost *:80>
    ServerName platform.deroyalhotspot.name.ng
    Redirect permanent / https://platform.deroyalhotspot.name.ng/
</VirtualHost>

<VirtualHost *:443>
    ServerName platform.deroyalhotspot.name.ng
    DocumentRoot /var/www/deroyal-hotspot-os/frontend/dist

    SSLEngine on
    SSLCertificateFile     /etc/letsencrypt/live/deroyalhotspot.name.ng/fullchain.pem
    SSLCertificateKeyFile  /etc/letsencrypt/live/deroyalhotspot.name.ng/privkey.pem

    <Directory /var/www/deroyal-hotspot-os/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        FallbackResource /index.html
    </Directory>

    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:5000/api/
    ProxyPassReverse /api/ http://127.0.0.1:5000/api/

    # Extra restriction: allow only trusted IPs for Super Admin (optional but recommended)
    # <LocationMatch "^/api/v1/platform/">
    #     Require ip 203.0.113.0/24
    # </LocationMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"

    ErrorLog  ${APACHE_LOG_DIR}/deroyal-platform-error.log
    CustomLog ${APACHE_LOG_DIR}/deroyal-platform-access.log combined
</VirtualHost>


# ── account.deroyalhotspot.name.ng — Customer accounts ──────────────────────
<VirtualHost *:80>
    ServerName account.deroyalhotspot.name.ng
    Redirect permanent / https://account.deroyalhotspot.name.ng/
</VirtualHost>

<VirtualHost *:443>
    ServerName account.deroyalhotspot.name.ng
    DocumentRoot /var/www/deroyal-hotspot-os/frontend/dist

    SSLEngine on
    SSLCertificateFile     /etc/letsencrypt/live/deroyalhotspot.name.ng/fullchain.pem
    SSLCertificateKeyFile  /etc/letsencrypt/live/deroyalhotspot.name.ng/privkey.pem

    <Directory /var/www/deroyal-hotspot-os/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        FallbackResource /index.html
    </Directory>

    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:5000/api/
    ProxyPassReverse /api/ http://127.0.0.1:5000/api/

    Header always set X-Content-Type-Options "nosniff"

    ErrorLog  ${APACHE_LOG_DIR}/deroyal-account-error.log
    CustomLog ${APACHE_LOG_DIR}/deroyal-account-access.log combined
</VirtualHost>


# ── api.deroyalhotspot.name.ng — Backend API (direct access) ─────────────────
# Use this only if you need direct API subdomain access.
# Normal browser traffic hits /api/* via the vhosts above — this is optional.
<VirtualHost *:80>
    ServerName api.deroyalhotspot.name.ng
    Redirect permanent / https://api.deroyalhotspot.name.ng/
</VirtualHost>

<VirtualHost *:443>
    ServerName api.deroyalhotspot.name.ng

    SSLEngine on
    SSLCertificateFile     /etc/letsencrypt/live/deroyalhotspot.name.ng/fullchain.pem
    SSLCertificateKeyFile  /etc/letsencrypt/live/deroyalhotspot.name.ng/privkey.pem

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/

    Header always set Access-Control-Allow-Origin  "https://deroyalhotspot.name.ng"
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization"

    ErrorLog  ${APACHE_LOG_DIR}/deroyal-api-error.log
    CustomLog ${APACHE_LOG_DIR}/deroyal-api-access.log combined
</VirtualHost>
